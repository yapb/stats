name: census

on:
  schedule:
    - cron: '17 3 * * *'  # daily
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, stats-pi]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector deps
        run: pip install -r collector/requirements.txt

      - name: Today
        id: today
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          mkdir -p "$HOME/census-cache"
          echo "MASTER_CACHE=$HOME/census-cache/master-cache.json" >> "$GITHUB_ENV"

      - name: Restore master cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MASTER_CACHE }}
          key: master-${{ steps.today.outputs.date }}

      - name: Fetch geo database
        run: curl -sL --max-time 180 -o "$HOME/census-cache/ip-to-country.mmdb" "https://media.githubusercontent.com/media/iplocate/ip-address-databases/main/ip-to-country/ip-to-country.mmdb"

      - name: Run census
        env:
          STEAM_WEBAPI_KEY: ${{ secrets.STEAM_WEBAPI_KEY }}
        run: |
          ARGS="--out web/data --geoip-mmdb $HOME/census-cache/ip-to-country.mmdb"
          if [ -f "$MASTER_CACHE" ]; then
            ARGS="$ARGS --master-cache $MASTER_CACHE"
          else
            ARGS="$ARGS --save-master $MASTER_CACHE"
          fi
          python collector/collect.py $ARGS

      - name: Save master cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.MASTER_CACHE }}
          key: master-${{ steps.today.outputs.date }}

      # Disabled for now (enable with the release watch): opens one issue
      # per freshly seen addon version, deduped via web/data/notified.json.
      # - name: Notify new versions
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   run: python collector/notify.py

      - name: Commit fresh data
        run: |
          git config user.name 'yapb-stats-bot'
          git config user.email 'yapb-stats-bot@users.noreply.github.com'
          git add web/data/latest.json web/data/history.json web/data/notified.json
          git diff --cached --quiet || { git commit -m "census $(date -u +%F)"; git pull --rebase origin master; git push; }

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        run: |
          npm ci --prefix web
          npm run build --prefix web
          cp -r web/data web/dist/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - uses: actions/deploy-pages@v5
        id: deployment
