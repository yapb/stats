<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Addons Stats - Half-Life server census</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0b0e14; }
  .card { background: #131722; border: 1px solid #232a3b; border-radius: .8rem; }
  .num { font-variant-numeric: tabular-nums; }
  a { color: #7aa2f7; }
  a:hover { text-decoration: underline; }
  table.stats { border-collapse: collapse; }
  table.stats td, table.stats th { padding: .45rem .75rem; border-bottom: 1px solid #1c2333; }
  table.stats thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em;
    color: #64748b; text-align: left; }
  table.stats tbody tr.link { cursor: pointer; }
  table.stats tbody tr.link:hover { background: rgba(122,162,247,.08); }
  table.stats tbody tr.active { background: rgba(122,162,247,.14); }
  .scroll10 { max-height: 32rem; overflow-y: auto; }
  .vrow { display: flex; align-items: center; gap: .6rem; padding: .3rem .4rem;
    border-radius: .5rem; cursor: pointer; }
  .vrow:hover { background: rgba(122,162,247,.08); }
  .vrow.active { background: rgba(158,206,106,.14); }
  .vbar { height: .55rem; border-radius: 999px; background: linear-gradient(90deg, #7aa2f7, #9ece6a); min-width: 2px; }
  .vname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 2.4rem;
    height: 2.4rem; border-radius: .7rem; font-weight: 700; font-size: 1.1rem; color: #0b0e14; flex: none; }
  .summary dt { color: #64748b; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; }
  .summary dd { color: #fff; font-weight: 600; }
  .capsule { border-radius: .4rem; }
  .crumb { font-size: .8rem; color: #64748b; }
</style>
</head>
<body class="text-slate-200 min-h-screen">
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
